---
# galaxy.yml - Ansible Galaxy collection metadata
# https://docs.ansible.com/ansible/latest/dev_guide/collections_galaxy_meta.html
namespace: dfmateus
name: acm_dr
version: 1.0.0
description: >-
  Multi-Cluster Business Continuity automation for Red Hat Advanced Cluster Management (RHACM 2.10+).
  Delivers DR failover/failback, planned maintenance failover, readiness drills, and Spoke lifecycle
  management across ARO, ROSA HCP, AKS, EKS, GKE, IKS, and vanilla Kubernetes.
authors:
  - Diego Felipe Mateus <dfmateus@hotmail.com>
license:
  - GPL-3.0-or-later

repository: https://github.com/dfmateus/acm_dr
documentation: https://github.com/dfmateus/acm_dr/blob/main/README.md
homepage: https://github.com/dfmateus/acm_dr
issues: https://github.com/dfmateus/acm_dr/issues
readme: README.md

# Collection dependencies - versions mirror collections/requirements.yml
dependencies:
  kubernetes.core: ">=6.5.0,<7.0.0"
  azure.azcollection: ">=3.20.0,<4.0.0"
  community.general: ">=13.2.0,<14.0.0"
  amazon.aws: ">=9.0.0,<10.0.0"

# Files and directories excluded from the built collection artifact.
# Rule of thumb: only roles/, playbooks/, plugins/, files/, docs/, examples/*.yml,
# meta/, galaxy.yml, README.md, LICENSE, and CHANGELOG.rst ship to consumers.
build_ignore:
  # --- hidden dirs and dotfiles (dev/CI tooling) ---
  - .agents
  - .ansible
  - .ansible-lint
  - .claude
  - .collections
  - .config
  - .cursor
  - .github
  - .gitignore
  - .gitattributes
  - .kube
  - .local
  - .markdownlint.yml
  - .markdownlint-cli2.yaml
  - .mcp.json
  - .python_history
  - .shellcheckrc
  - .vscode
  - .yamllint.yml
  - ansible.cfg
  - CLAUDE.md
  # --- role-level dotfiles (dev tooling, not collection content) ---
  - "roles/*/.ansible-lint"
  - "roles/*/.gitattributes"
  - "roles/*/.gitignore"
  - "roles/*/.yamllint.yml"
  # --- dev and operational content (not collection artifact) ---
  - changelogs
  - collections
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - CONTRIBUTORS.md
  - SECURITY.md
  - Makefile
  - molecule
  # --- examples sub-directories that are reference/dev material ---
  - examples/aap-config
  - examples/scripts
  - examples/ansible.cfg.example
  - examples/env-setup.sh.example
  # --- legacy exclude kept for safety ---
  - examples/configure-aap-objects.yml
  # --- examples sub-files that are dev material ---
  - examples/aap/import-vars.yml
  # --- scratch, secrets, build output ---
  - "*.crt"
  - "*.env"
  - ".env*"
  - "*.id_rsa"
  - "*.key"
  - "*.log"
  - "*.pem"
  - "*.pyc"
  - "*.retry"
  - "*.tar.gz"
  - "*env*.sh"
  - "*vault*"
  - __pycache__
  - ansible-navigator.log
  - context
  - env-setup.sh
  - secrets.yml
  - "sts_*.json"
  - tmp

tags:
  - cloud
  - infrastructure
  - rhacm
  - disasterrecovery
  - openshift
  - kubernetes
  - azure
  - aws
  - amazon
  - rosa
  - gitops
  - oadp
  - velero
  - dr
  - failover
  - acm
  - multicluster
  - backup
  - restore
  - spoke
...
