---
# roles/acm_argocd_instance/tasks/main.yml

- name: "MAIN | Display ArgoCD instance initialization status"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_argocd_instance_setup_banner_title: "🐙 ACM ARGOCD INSTANCE - '{{ acm_argocd_instance_setup_name }}'"
    acm_argocd_instance_setup_banner_lines:
      - "🎯 TARGET CONTEXT:   {{ k8s_target_context }}"
      - "📂 NAMESPACE:        {{ acm_argocd_instance_setup_namespace }}"
      - "🔀 GENERATOR:        {{ acm_argocd_instance_setup_generator_type }}"
      - "🛡️  CLUSTER-ADMIN RBAC: {{ acm_argocd_instance_setup_cluster_admin_rbac | bool }}"
  run_once: true
  tags:
    - always

- name: "[ARGOCD INSTANCE] | Validate required parameters"
  ansible.builtin.import_tasks: 00_validate.yml
  tags:
    - validate
    - stage00

- name: "[ARGOCD INSTANCE] | Create instance Namespace and managed Namespaces"
  ansible.builtin.import_tasks: 01_namespace.yml
  tags:
    - namespace
    - stage01

- name: "[ARGOCD INSTANCE] | Install the OpenShift GitOps Operator (idempotent, cluster-wide)"
  ansible.builtin.import_tasks: 02_gitops_operator.yml
  when: acm_argocd_instance_setup_manage_operator | default(true) | bool
  tags:
    - gitops_operator
    - stage02

- name: "[ARGOCD INSTANCE] | Create the ArgoCD Custom Resource"
  ansible.builtin.import_tasks: 03_argocd_cr.yml
  tags:
    - argocd_cr
    - stage03

- name: "[ARGOCD INSTANCE] | Apply cluster-scoped RBAC (conditional)"
  ansible.builtin.import_tasks: 04_rbac.yml
  when: acm_argocd_instance_setup_cluster_admin_rbac | default(false) | bool
  tags:
    - rbac
    - stage04

- name: "[ARGOCD INSTANCE] | Create Git credential Secret (conditional)"
  ansible.builtin.import_tasks: 05_repo_secret.yml
  when: acm_argocd_instance_setup_repo_url | default('') | length > 0
  tags:
    - repo_secret
    - stage05

- name: "[ARGOCD INSTANCE] | RHACM Integration: GitOpsCluster/Placement/ManagedClusterSetBinding (conditional)"
  ansible.builtin.import_tasks: 06_rhacm_integration.yml
  when: acm_argocd_instance_setup_wire_rhacm_integration | default(false) | bool
  tags:
    - rhacm_integration
    - stage06

- name: "[ARGOCD INSTANCE] | Create ApplicationSet (conditional on generator_type)"
  ansible.builtin.import_tasks: 07_applicationset.yml
  when: acm_argocd_instance_setup_generator_type | default('none') != 'none'
  tags:
    - applicationset
    - stage07

- name: "[ARGOCD INSTANCE] | Publish ConsoleLink (conditional)"
  ansible.builtin.import_tasks: 08_console_link.yml
  when: acm_argocd_instance_setup_console_link_enabled | default(false) | bool
  tags:
    - console_link
    - stage08

- name: "[ARGOCD INSTANCE] | Display completion summary"
  ansible.builtin.import_tasks: 09_summary.yml
  tags:
    - summary
    - stage09
...
