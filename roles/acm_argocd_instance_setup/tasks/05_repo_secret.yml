---
# roles/acm_argocd_instance/tasks/05_repo_secret.yml
# =============================================================================
# STAGE 05: GIT CREDENTIAL SECRET (CONDITIONAL ON repo_url)
# =============================================================================
# Field Finding (inherited from acm_dr_hub_setup): this Secret must exist in
# the SAME namespace as the ArgoCD instance that will use it -- each instance
# only sees Secrets from its own namespace (there is no implicit sharing
# between different instances).

- name: "[REPO SECRET] | 5.1) Create Git credential Secret - {{ acm_argocd_instance_setup_namespace }}"
  kubernetes.core.k8s:
    context: "{{ k8s_target_context }}"
    state: present
    template: repo_secret.yml.j2
  no_log: "{{ acm_argocd_instance_setup_debug_no_log | default(true) | bool }}"
...
