---
# roles/acm_dr_readiness_check/tasks/main.yml
# ==========================================================================
# DR Readiness Check - read-only health verification of both Hub clusters.
#
# Checks (all read-only, no cluster state modified):
#   1. BackupSchedule exists on Source Hub and is not paused
#   2. BackupStorageLocation is Available on Source Hub
#   3. Latest backup age is within the RPO threshold
#   4. ManagedCluster count on Source Hub (informational)
#   5. Passive sync Restore CR exists on Destination Hub
#   6. Summary report
#
# Variables consumed (defined in defaults/main.yml):
#   acm_dr_readiness_check_backup_namespace      - OADP namespace on both Hubs
#   acm_dr_readiness_check_backup_schedule_name  - BackupSchedule name (empty = auto-detect)
#   acm_dr_readiness_check_rpo_seconds           - max acceptable backup age in seconds
#   acm_dr_readiness_check_min_spoke_count       - minimum expected Spoke count (0 = skip)
#   acm_dr_readiness_check_fail_on_stale_backup  - fail vs. warn on stale backup
#   acm_dr_readiness_check_fail_on_missing_restore - fail vs. warn on missing passive Restore
#
# Contexts consumed (defined in the calling playbook's pre_tasks):
#   k8s_source_context   - active Hub kubeconfig context (from -e or per-cluster credentials)
#   k8s_dest_context     - passive Hub kubeconfig context (from -e or per-cluster credentials)
# ==========================================================================

# ==========================================================================
# Check 1 - BackupSchedule on Source Hub
# ==========================================================================

- name: "[READINESS 1.1] | Fetch BackupSchedule list from Source Hub"
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: BackupSchedule
    namespace: "{{ acm_dr_readiness_check_backup_namespace }}"
    name: "{{ acm_dr_readiness_check_backup_schedule_name | default(omit, true) }}"
    context: "{{ k8s_source_context }}"  # noqa var-naming[no-role-prefix]
  register: acm_dr_readiness_check_bschedule_info

- name: "[READINESS 1.2] | Assert BackupSchedule exists on Source Hub"
  ansible.builtin.assert:
    that:
      - acm_dr_readiness_check_bschedule_info.resources | length > 0
    fail_msg: >-
      ❌ FAILED! Oh. No! => No BackupSchedule found in namespace
      '{{ acm_dr_readiness_check_backup_namespace }}' on Source Hub
      '{{ k8s_source_context }}'. The active Hub must have a BackupSchedule
      for backups to run. Check that OADP is installed and the Hub Setup
      playbook completed (is_primary_hub=true).
    success_msg: >-
      ✅ PASSED! Oh. Yes! => BackupSchedule found on Source Hub '{{ k8s_source_context }}'.

- name: "[READINESS 1.3] | Assert BackupSchedule is not paused on Source Hub"
  ansible.builtin.assert:
    that:
      - not (acm_dr_readiness_check_bschedule_info.resources[0].spec.paused | default(false) | bool)
    fail_msg: >-
      ❌ FAILED! Oh. No! => BackupSchedule is paused on Source Hub
      '{{ k8s_source_context }}'. A paused BackupSchedule means the Hub is
      fenced (either a previous failover did not complete, or it was manually
      paused). Run Stage 06 of the failover pipeline to re-enable it, or
      check for a leftover fencing from a previous run (see allow_fenced_origin).
    success_msg: >-
      ✅ PASSED! Oh. Yes! => BackupSchedule is active (not paused) on Source Hub '{{ k8s_source_context }}'.

# ==========================================================================
# Check 2 - BackupStorageLocation on Source Hub
# ==========================================================================

- name: "[READINESS 2.1] | Fetch BackupStorageLocation list from Source Hub"
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: BackupStorageLocation
    namespace: "{{ acm_dr_readiness_check_backup_namespace }}"
    context: "{{ k8s_source_context }}"  # noqa var-naming[no-role-prefix]
  register: acm_dr_readiness_check_bsl_info

- name: "[READINESS 2.2] | Assert at least one Available BSL on Source Hub"
  ansible.builtin.assert:
    that:
      - acm_dr_readiness_check_bsl_info.resources | length > 0
      - acm_dr_readiness_check_bsl_info.resources | selectattr('status.phase', 'eq', 'Available') | list | length > 0
    fail_msg: >-
      ❌ FAILED! Oh. No! => No Available BackupStorageLocation found in namespace
      '{{ acm_dr_readiness_check_backup_namespace }}' on Source Hub
      '{{ k8s_source_context }}'. An unavailable BSL means Velero cannot write
      backups. Check cloud credentials (Azure Blob or AWS S3) and Velero pod logs.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => BackupStorageLocation is Available on Source Hub '{{ k8s_source_context }}'.

# ==========================================================================
# Check 3 - Latest backup freshness (RPO check)
# ==========================================================================

- name: "[READINESS 3.1] | Fetch recent Backup objects from Source Hub"
  kubernetes.core.k8s_info:
    api_version: velero.io/v1
    kind: Backup
    namespace: "{{ acm_dr_readiness_check_backup_namespace }}"
    context: "{{ k8s_source_context }}"  # noqa var-naming[no-role-prefix]
    label_selectors:
      # ACM-managed backups carry this label; validation schedule backups are fastest to check
      - "velero.io/schedule-name=acm-validation-policy-schedule"
  register: acm_dr_readiness_check_backups_info

- name: "[READINESS 3.2] | Identify most recent completed Backup on Source Hub"
  ansible.builtin.set_fact:
    # Sort by completionTimestamp descending and pick the first; filter out failed backups.
    acm_dr_readiness_check_latest_backup: >-
      {{ (acm_dr_readiness_check_backups_info.resources
          | selectattr('status.phase', 'eq', 'Completed')
          | sort(attribute='status.completionTimestamp', reverse=True)
          | list | first) | default({}) }}
  when: acm_dr_readiness_check_backups_info.resources | length > 0

- name: "[READINESS 3.3] | Warn - no validation backup found on Source Hub"
  ansible.builtin.debug:
    msg: >-
      ⚠️ WARNING: No completed validation backup found on Source Hub
      '{{ k8s_source_context }}'. This may mean the acm-validation-policy-schedule
      schedule has not run yet (normal in the first 2-4 hours after Hub Setup), or
      Velero is failing to write to the BSL. Check Check 2 (BSL status) above.
  when: >-
    acm_dr_readiness_check_backups_info.resources | length == 0
    or (acm_dr_readiness_check_latest_backup | default({})) == {}

- name: "[READINESS 3.4] | Calculate backup age in seconds"
  ansible.builtin.set_fact:
    # Convert completionTimestamp to seconds since epoch and compare to now().
    # Format: "2026-08-17T10:00:00Z" - ISO 8601 UTC.
    acm_dr_readiness_check_backup_age_seconds: >-
      {{ ((now(utc=True) -
           (acm_dr_readiness_check_latest_backup.status.completionTimestamp
            | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds()) | int }}
  when: (acm_dr_readiness_check_latest_backup | default({})) != {}

- name: "[READINESS 3.5] | Assert backup is within RPO threshold"
  ansible.builtin.assert:
    that:
      - acm_dr_readiness_check_backup_age_seconds | int <= acm_dr_readiness_check_rpo_seconds | int
    fail_msg: >-
      ❌ FAILED! Oh. No! => Latest backup on Source Hub '{{ k8s_source_context }}' is
      {{ (acm_dr_readiness_check_backup_age_seconds | int / 3600) | round(1) }} hours old,
      which exceeds the RPO threshold of
      {{ (acm_dr_readiness_check_rpo_seconds | int / 3600) | round(1) }} hours
      (acm_dr_readiness_check_rpo_seconds={{ acm_dr_readiness_check_rpo_seconds }}).
      Check BSL availability and the Velero pod health.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => Latest backup is
      {{ (acm_dr_readiness_check_backup_age_seconds | int / 3600) | round(1) }} hours old -
      within RPO threshold of {{ (acm_dr_readiness_check_rpo_seconds | int / 3600) | round(1) }} hours.
  when:
    - (acm_dr_readiness_check_latest_backup | default({})) != {}
    - acm_dr_readiness_check_fail_on_stale_backup | bool

- name: "[READINESS 3.5w] | Warn (non-blocking) - backup older than RPO threshold"
  ansible.builtin.debug:
    msg: >-
      ⚠️ WARNING: Latest backup on Source Hub '{{ k8s_source_context }}' is
      {{ (acm_dr_readiness_check_backup_age_seconds | int / 3600) | round(1) }} hours old
      (RPO threshold: {{ (acm_dr_readiness_check_rpo_seconds | int / 3600) | round(1) }} hours).
      Set acm_dr_readiness_check_fail_on_stale_backup=true to make this a blocking failure.
  when:
    - (acm_dr_readiness_check_latest_backup | default({})) != {}
    - not (acm_dr_readiness_check_fail_on_stale_backup | bool)
    - acm_dr_readiness_check_backup_age_seconds | int > acm_dr_readiness_check_rpo_seconds | int

# ==========================================================================
# Check 4 - Spoke count on Source Hub (informational)
# ==========================================================================

- name: "[READINESS 4.1] | Fetch ManagedCluster count from Source Hub"
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    context: "{{ k8s_source_context }}"  # noqa var-naming[no-role-prefix]
  register: acm_dr_readiness_check_managed_clusters

- name: "[READINESS 4.2] | Report Spoke fleet size on Source Hub"
  ansible.builtin.debug:
    msg: >-
      🔎 INFO: Source Hub '{{ k8s_source_context }}' has
      {{ (acm_dr_readiness_check_managed_clusters.resources
          | rejectattr('metadata.name', 'eq', 'local-cluster') | list | length) }} Spoke(s)
      connected (excluding local-cluster).
      {{ '' if (acm_dr_readiness_check_min_spoke_count | int == 0) else
         '⚠️ WARNING: fewer than expected (' ~ acm_dr_readiness_check_min_spoke_count ~ ')!'
         if ((acm_dr_readiness_check_managed_clusters.resources
              | rejectattr('metadata.name', 'eq', 'local-cluster') | list | length) | int <
             acm_dr_readiness_check_min_spoke_count | int) else '✅ Count meets minimum.' }}

# ==========================================================================
# Check 5 - Passive sync Restore on Destination Hub
# ==========================================================================

- name: "[READINESS 5.1] | Fetch Restore list from Destination Hub"
  kubernetes.core.k8s_info:
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Restore
    namespace: "{{ acm_dr_readiness_check_backup_namespace }}"
    context: "{{ k8s_dest_context }}"  # noqa var-naming[no-role-prefix]
  register: acm_dr_readiness_check_restore_info

- name: "[READINESS 5.2] | Identify passive sync Restore on Destination Hub"
  ansible.builtin.set_fact:
    # The passive Restore created by Hub Setup (is_primary_hub=false) has
    # syncRestoreWithNewBackups: true in its spec. Pick the first one found.
    acm_dr_readiness_check_passive_restore: >-
      {{ acm_dr_readiness_check_restore_info.resources
         | selectattr('spec.syncRestoreWithNewBackups', 'defined')
         | selectattr('spec.syncRestoreWithNewBackups', 'eq', true)
         | list | first | default({}) }}

- name: "[READINESS 5.3] | Assert passive sync Restore exists on Destination Hub"
  ansible.builtin.assert:
    that:
      - (acm_dr_readiness_check_passive_restore | default({})) != {}
    fail_msg: >-
      ❌ FAILED! Oh. No! => No passive sync Restore (syncRestoreWithNewBackups: true) found in
      namespace '{{ acm_dr_readiness_check_backup_namespace }}' on Destination Hub
      '{{ k8s_dest_context }}'. The passive Hub must have this Restore CR to stay pre-positioned
      with the latest backup data. Run Hub Setup on the DR Hub (is_primary_hub=false) to create it.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => Passive sync Restore
      '{{ (acm_dr_readiness_check_passive_restore | default({})).metadata.name | default("found") }}'
      is present on Destination Hub '{{ k8s_dest_context }}'.
  when: acm_dr_readiness_check_fail_on_missing_restore | bool

- name: "[READINESS 5.3w] | Warn (non-blocking) - passive Restore absent on Destination Hub"
  ansible.builtin.debug:
    msg: >-
      ⚠️ WARNING: No passive sync Restore found on Destination Hub '{{ k8s_dest_context }}'.
      The DR Hub is not pre-positioned. Set acm_dr_readiness_check_fail_on_missing_restore=true
      to block on this check.
  when:
    - not (acm_dr_readiness_check_fail_on_missing_restore | bool)
    - (acm_dr_readiness_check_passive_restore | default({})) == {}

# ==========================================================================
# Check 6 - Summary
# ==========================================================================

- name: "[READINESS 6.1] | Print readiness summary"
  ansible.builtin.debug:
    msg: >-
      🔎 READINESS SUMMARY for failover direction
      '{{ k8s_source_context }} → {{ k8s_dest_context }}':
      Check 1 (BackupSchedule): ✅ |
      Check 2 (BSL Available): ✅ |
      Check 3 (Backup age): {{ '⚠️ stale (non-blocking)' if
        ((acm_dr_readiness_check_backup_age_seconds | default(0) | int) >
         acm_dr_readiness_check_rpo_seconds | int
         and not (acm_dr_readiness_check_fail_on_stale_backup | bool))
        else '✅' }} |
      Check 4 (Spoke count):
      {{ (acm_dr_readiness_check_managed_clusters.resources
          | rejectattr('metadata.name', 'eq', 'local-cluster') | list | length) }} Spoke(s) |
      Check 5 (Passive Restore): {{ '✅' if (acm_dr_readiness_check_passive_restore | default({})) != {} else '⚠️ absent' }}
...
