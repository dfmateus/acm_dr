---
# =============================================================================
# BOOTSTRAP AAP SELF-REGISTRATION
#
# Reads the SA token created by 02_rbac.yml + 03_wait_token.yml, then calls
# the AAP REST API to create or update the permanent "ACM DR - Target Cluster"
# credential. Idempotent: re-running this step rotates the stored token.
#
# Runs only when CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN are both set
# (injected by the "ACM DR - AAP Automation Token" credential attached to the
# Bootstrap JT). If either is absent, this file prints a skip notice and the
# role still succeeds.
# Uses ansible.builtin.uri only - no ansible.controller collection dependency.
#
# no_log discipline:
#   Token decode + URI calls that send api_key in the body: no_log: true (always)
#   GET lookups (no secret in body): no_log: "{{ acm_dr_cluster_onboard_debug_no_log | bool }}"
#   Confirmation output:             no_log: false (name and host are not sensitive)
# =============================================================================

# -----------------------------------------------------------------------
# Phase 0: determine whether self-registration is enabled
# -----------------------------------------------------------------------
- name: "[BOOTSTRAP - AAP] | 5.0.1) Check whether AAP Automation Token credential is attached"
  ansible.builtin.set_fact:
    acm_dr_cluster_onboard_aap_enabled: >-
      {{ (lookup('ansible.builtin.env', 'CONTROLLER_HOST') | length > 0) and
         (lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') | length > 0) }}
    acm_dr_cluster_onboard_controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
    acm_dr_cluster_onboard_controller_verify_ssl: >-
      {{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | default('false') | bool }}

- name: "[BOOTSTRAP - AAP] | 5.0.2) Skip self-registration (CONTROLLER_HOST or CONTROLLER_OAUTH_TOKEN not set)"
  ansible.builtin.debug:
    msg: >-
      🔎 CONTROLLER_HOST or CONTROLLER_OAUTH_TOKEN is not set. The 'ACM DR - AAP Automation Token'
      credential is not attached to this job. Skipping automatic AAP credential registration.
      To enable auto-registration, attach the 'AAP Bootstrap Automation (API Token)' credential
      to the Bootstrap JT.
  when: not acm_dr_cluster_onboard_aap_enabled | bool

# -----------------------------------------------------------------------
# Phase 1: read and decode the SA token from the cluster Secret
# -----------------------------------------------------------------------
- name: "[BOOTSTRAP - AAP] | 5.1.1) Read SA token from cluster Secret"
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ acm_dr_cluster_onboard_token_secret }}"
    namespace: "{{ acm_dr_cluster_onboard_namespace }}"
    context: "{{ k8s_target_context | default(omit) }}"
  register: acm_dr_cluster_onboard_token_read
  no_log: "{{ acm_dr_cluster_onboard_debug_no_log | bool }}"
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.1.2) Decode SA bearer token"
  ansible.builtin.set_fact:
    acm_dr_cluster_onboard_sa_token: "{{ acm_dr_cluster_onboard_token_read.resources[0].data.token | b64decode }}"
  no_log: true  # token must never appear in logs, regardless of debug mode
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.1.3) Resolve cluster API host and kubeconfig context name"
  ansible.builtin.set_fact:
    # K8S_AUTH_HOST is set by the temp "OpenShift Bearer Token" credential.
    # ACM_DR_TARGET_HOST is set by a permanent "ACM DR - Target Cluster" credential.
    acm_dr_cluster_onboard_cluster_host: >-
      {{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST')
         | default(lookup('ansible.builtin.env', 'ACM_DR_TARGET_HOST'), true) }}
    # context_name drives the synthetic kubeconfig context created by acm_dr_kubeconfig_resolver.
    # Prefer the cluster display name (survey field); fall back to the credential name.
    acm_dr_cluster_onboard_context_name: >-
      {{ acm_dr_cluster_onboard_cluster_name
         | default(acm_dr_cluster_onboard_aap_credential_name, true) }}
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.1.4) Assert cluster API host is resolved"
  ansible.builtin.assert:
    that:
      - acm_dr_cluster_onboard_cluster_host | length > 0
    fail_msg: >-
      ❌ FAILED! Oh. No! => Cannot resolve the cluster API host. Neither K8S_AUTH_HOST nor
      ACM_DR_TARGET_HOST is set. Check that the cluster credential is attached to this job.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => Cluster API host resolved: {{ acm_dr_cluster_onboard_cluster_host }}
  when: acm_dr_cluster_onboard_aap_enabled | bool

# -----------------------------------------------------------------------
# Phase 2: look up AAP object IDs (org and credential type)
# -----------------------------------------------------------------------
- name: "[BOOTSTRAP - AAP] | 5.2.1) Look up AAP organization ID by name"
  ansible.builtin.uri:
    url: "{{ acm_dr_cluster_onboard_controller_host }}/api/controller/v2/organizations/?name={{ acm_dr_cluster_onboard_aap_organization | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
    validate_certs: "{{ acm_dr_cluster_onboard_controller_verify_ssl }}"
    status_code: [200]
  register: acm_dr_cluster_onboard_aap_org_lookup
  no_log: "{{ acm_dr_cluster_onboard_debug_no_log | bool }}"
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.2.2) Assert organization was found in AAP"
  ansible.builtin.assert:
    that:
      - acm_dr_cluster_onboard_aap_org_lookup.json.count == 1
    fail_msg: >-
      ❌ FAILED! Oh. No! => Organization '{{ acm_dr_cluster_onboard_aap_organization }}' not found in
      AAP. Check that acm_dr_cluster_onboard_aap_organization is set to an existing org name.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => Organization '{{ acm_dr_cluster_onboard_aap_organization }}' found
      (id={{ acm_dr_cluster_onboard_aap_org_lookup.json.results[0].id }}).
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.2.3) Look up AAP credential type ID for cluster SA"
  ansible.builtin.uri:
    url: "{{ acm_dr_cluster_onboard_controller_host }}/api/controller/v2/credential_types/?name={{ acm_dr_cluster_onboard_aap_credential_type_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
    validate_certs: "{{ acm_dr_cluster_onboard_controller_verify_ssl }}"
    status_code: [200]
  register: acm_dr_cluster_onboard_cred_type_lookup
  no_log: "{{ acm_dr_cluster_onboard_debug_no_log | bool }}"
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.2.4) Assert credential type was found in AAP"
  ansible.builtin.assert:
    that:
      - acm_dr_cluster_onboard_cred_type_lookup.json.count == 1
    fail_msg: >-
      ❌ FAILED! Oh. No! => Credential type '{{ acm_dr_cluster_onboard_aap_credential_type_name }}' not found in AAP.
      Run setup-aap-from-casc.yml before the Bootstrap JT to pre-create all credential types.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => Credential type found
      (id={{ acm_dr_cluster_onboard_cred_type_lookup.json.results[0].id }}).
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.2.5) Store org ID and credential type ID"
  ansible.builtin.set_fact:
    acm_dr_cluster_onboard_aap_org_id: "{{ acm_dr_cluster_onboard_aap_org_lookup.json.results[0].id | int }}"
    acm_dr_cluster_onboard_aap_cred_type_id: "{{ acm_dr_cluster_onboard_cred_type_lookup.json.results[0].id | int }}"
  when: acm_dr_cluster_onboard_aap_enabled | bool

# -----------------------------------------------------------------------
# Phase 3: create or update the permanent credential (idempotent)
# -----------------------------------------------------------------------
- name: "[BOOTSTRAP - AAP] | 5.3.1) Check whether permanent credential already exists in AAP"
  ansible.builtin.uri:
    url: "{{ acm_dr_cluster_onboard_controller_host }}/api/controller/v2/credentials/?name={{ acm_dr_cluster_onboard_aap_credential_name | urlencode }}&credential_type={{ acm_dr_cluster_onboard_aap_cred_type_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
    validate_certs: "{{ acm_dr_cluster_onboard_controller_verify_ssl }}"
    status_code: [200]
  register: acm_dr_cluster_onboard_cred_existing
  no_log: "{{ acm_dr_cluster_onboard_debug_no_log | bool }}"
  when: acm_dr_cluster_onboard_aap_enabled | bool

- name: "[BOOTSTRAP - AAP] | 5.3.2) Create permanent SA credential in AAP (first bootstrap)"
  ansible.builtin.uri:
    url: "{{ acm_dr_cluster_onboard_controller_host }}/api/controller/v2/credentials/"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
    validate_certs: "{{ acm_dr_cluster_onboard_controller_verify_ssl }}"
    body_format: json
    body:
      name: "{{ acm_dr_cluster_onboard_aap_credential_name }}"
      description: >-
        {{ acm_dr_cluster_onboard_aap_credential_description
           if acm_dr_cluster_onboard_aap_credential_description | default('') | length > 0
           else 'Zero-Trust ServiceAccount for cluster '
             + (acm_dr_cluster_onboard_cluster_name | default(acm_dr_cluster_onboard_aap_credential_name))
             + '. Bearer token for ' + acm_dr_cluster_onboard_sa_name
             + ' in the ' + acm_dr_cluster_onboard_namespace
             + ' namespace, cluster-admin scoped. Auto-registered by Bootstrap JT.' }}
      organization: "{{ acm_dr_cluster_onboard_aap_org_id }}"
      credential_type: "{{ acm_dr_cluster_onboard_aap_cred_type_id }}"
      inputs:
        host: "{{ acm_dr_cluster_onboard_cluster_host }}"
        api_key: "{{ acm_dr_cluster_onboard_sa_token }}"
        ca_data: ""
        context_name: "{{ acm_dr_cluster_onboard_context_name }}"
    status_code: [201]
  no_log: true  # inputs contain the SA bearer token
  when:
    - acm_dr_cluster_onboard_aap_enabled | bool
    - acm_dr_cluster_onboard_cred_existing.json.count == 0

- name: "[BOOTSTRAP - AAP] | 5.3.3) Update existing SA credential in AAP (token rotation)"
  ansible.builtin.uri:
    url: "{{ acm_dr_cluster_onboard_controller_host }}/api/controller/v2/credentials/{{ acm_dr_cluster_onboard_cred_existing.json.results[0].id }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
    validate_certs: "{{ acm_dr_cluster_onboard_controller_verify_ssl }}"
    body_format: json
    body:
      inputs:
        host: "{{ acm_dr_cluster_onboard_cluster_host }}"
        api_key: "{{ acm_dr_cluster_onboard_sa_token }}"
        ca_data: ""
        context_name: "{{ acm_dr_cluster_onboard_context_name }}"
    status_code: [200]
  no_log: true  # inputs contain the SA bearer token
  when:
    - acm_dr_cluster_onboard_aap_enabled | bool
    - acm_dr_cluster_onboard_cred_existing.json.count > 0

# -----------------------------------------------------------------------
# Phase 4: confirmation output
# -----------------------------------------------------------------------
- name: "[BOOTSTRAP - AAP] | 5.4.1) Confirm permanent credential registered in AAP"
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - " ✅ BOOTSTRAP COMPLETE - AAP credential auto-registered"
      - "======================================================================"
      - ""
      - " Cluster     : {{ acm_dr_cluster_onboard_cluster_name | default('(not set)') }}"
      - " Namespace   : {{ acm_dr_cluster_onboard_namespace }}"
      - " SA          : {{ acm_dr_cluster_onboard_sa_name }}"
      - " Secret      : {{ acm_dr_cluster_onboard_token_secret }}"
      - ""
      - " AAP Credential : {{ acm_dr_cluster_onboard_aap_credential_name }}"
      - " Cluster API    : {{ acm_dr_cluster_onboard_cluster_host }}"
      - " Context name   : {{ acm_dr_cluster_onboard_context_name }}"
      - " Action         : {{ 'created (new)' if acm_dr_cluster_onboard_cred_existing.json.count == 0 else 'updated (token rotated)' }}"
      - ""
      - " Next step: delete the temporary cluster-admin credential used to run"
      - " this bootstrap job. It is no longer needed."
      - "======================================================================"
  when: acm_dr_cluster_onboard_aap_enabled | bool
...
