- name: "[STAGE 04 - ACM Cleanup] | Display complete Red Hat ACM removal completion status - {{ k8s_target_context }}"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/04_mch_acm_cleanup_summary.j2').split('\n') }}"
  run_once: true
