---
# =============================================================================
# INITIAL HEADER AND STAGE 05 METADATA DISPLAY
# =============================================================================

- name: "[STAGE 05 - Azure Storage Cleanup] | Display optional Azure Storage purge metadata"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_dr_hub_cleanup_banner_title: "☁️ STAGE 05 - Optional Azure Storage Account Purge"
    acm_dr_hub_cleanup_banner_lines:
      - "🔄 acm_dr_hub_cleanup_purge_azure_storage: {{ acm_dr_hub_cleanup_purge_azure_storage | default(false) | bool }}"
  run_once: true

# =============================================================================
# STEP 5.0: DEFAULT PATH (FLAG OFF) - NOTHING IN AZURE IS TOUCHED
# =============================================================================

- name: "[STAGE 05 - Azure Storage Cleanup] | 5.0.1) ℹ️ Inform that Azure Storage was preserved (default)"
  ansible.builtin.debug:
    msg:
      - "ℹ️  [PRESERVED]: acm_dr_hub_cleanup_purge_azure_storage=false (default). The Storage Account and its"
      - "    Backup/Observability Containers were NOT touched. This is expected when the primary ACM Hub"
      - "    still depends on the same shared storage. To completely delete (irreversible),"
      - "    re-run with -e acm_dr_hub_cleanup_purge_azure_storage=true."
  run_once: true
  when: not (acm_dr_hub_cleanup_purge_azure_storage | default(false) | bool)

# =============================================================================
# STEP 5.1: DESTRUCTIVE PATH (FLAG ON) - TOTAL AND IRREVERSIBLE REMOVAL
# =============================================================================

- name: "[STAGE 05 - Azure Storage Cleanup] | 5.1.1) Assert mandatory Azure credentials for purge"
  ansible.builtin.assert:
    that:
      - acm_dr_hub_cleanup_azure_subscription_id | default('') | length > 0
      - acm_dr_hub_cleanup_azure_tenant_id | default('') | length > 0
      - acm_dr_hub_cleanup_azure_client_id | default('') | length > 0
      - acm_dr_hub_cleanup_azure_client_secret | default('') | length > 0
      - acm_dr_hub_cleanup_azure_resource_group | default('') | length > 0
      - acm_dr_hub_cleanup_azure_storage_account_name | default('') | length > 0
    fail_msg: >-
      ❌ FAILED! Oh. No! => acm_dr_hub_cleanup_purge_azure_storage=true requires complete Azure
      credentials (subscription/tenant/client id/secret, resource group and storage account name).
    success_msg: "✅ PASSED! Oh. Yes! => Azure credentials validated for storage purge."
  no_log: "{{ acm_dr_hub_cleanup_debug_no_log | default(true) | bool }}"
  when: acm_dr_hub_cleanup_purge_azure_storage | default(false) | bool

- name: "[STAGE 05 - Azure Storage Cleanup] | 5.1.2) 🔎 [DRY-RUN] Storage Account purge preview"
  ansible.builtin.debug:
    msg: >-
      🔎 [DRY-RUN] Storage Account '{{ acm_dr_hub_cleanup_azure_storage_account_name }}' (Resource Group
      '{{ acm_dr_hub_cleanup_azure_resource_group }}') would be PERMANENTLY REMOVED via
      azure_rm_storageaccount (state=absent), along with all its Containers (Velero Backups
      and Thanos history). No actual changes were applied.
  when:
    - acm_dr_hub_cleanup_purge_azure_storage | default(false) | bool
    - acm_dr_hub_cleanup_dry_run | default(false) | bool

# azure.azcollection modules authenticate via env vars (AZURE_CLIENT_ID,
# AZURE_SECRET, AZURE_TENANT, AZURE_SUBSCRIPTION_ID). No explicit
# "az login" or "az account set" steps needed. The env vars are populated
# by AAP's "Microsoft Azure Resource Manager" credential type or by the
# local env-setup.sh script via defaults/main.yml resolution.
- name: "[STAGE 05 - Azure Storage Cleanup] | 5.1.3) 🗑️ PERMANENTLY REMOVE Storage Account and all Containers"
  # Deleting the Storage Account cascades to all containers and blobs
  # inside it. The module handles the confirmation natively (no --yes flag).
  azure.azcollection.azure_rm_storageaccount:
    resource_group: "{{ acm_dr_hub_cleanup_azure_resource_group }}"
    name: "{{ acm_dr_hub_cleanup_azure_storage_account_name }}"
    force_delete_nonempty: true  # storage account contains OADP backup and Thanos containers
    state: absent
  environment:
    AZURE_CLIENT_ID: "{{ acm_dr_hub_cleanup_azure_client_id }}"
    AZURE_SECRET: "{{ acm_dr_hub_cleanup_azure_client_secret }}"
    AZURE_TENANT: "{{ acm_dr_hub_cleanup_azure_tenant_id }}"
    AZURE_SUBSCRIPTION_ID: "{{ acm_dr_hub_cleanup_azure_subscription_id }}"
  no_log: "{{ acm_dr_hub_cleanup_debug_no_log | default(true) | bool }}"
  when:
    - acm_dr_hub_cleanup_purge_azure_storage | default(false) | bool
    - not (acm_dr_hub_cleanup_dry_run | default(false) | bool)

# =============================================================================
# STEP 5.2: COMPLETION SUMMARY AND STAGE 05 STATUS
# =============================================================================

- name: "[STAGE 05 - Azure Storage Cleanup] | Display Azure Storage purge completion status"
  ansible.builtin.debug:
    msg: >-
      {{
        '☁️ [STAGE 05]: Storage Account preserved (default). No action in Azure.'
        if not (acm_dr_hub_cleanup_purge_azure_storage | default(false) | bool)
        else (
          '🔎 [STAGE 05 - DRY-RUN]: simulated purge, no actual changes applied in Azure.'
          if (acm_dr_hub_cleanup_dry_run | default(false) | bool)
          else "🗑️ [STAGE 05]: Storage Account '" ~ acm_dr_hub_cleanup_azure_storage_account_name ~
            "' and its Containers were permanently removed from Azure."
        )
      }}
  run_once: true
...
