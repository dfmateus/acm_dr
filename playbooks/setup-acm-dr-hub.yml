---
# playbooks/setup-acm-dr-hub.yml
# =============================================================================
# HUB INFRASTRUCTURE PROVISIONING (RHACM DR LAB SETUP)
#
# Description:
#   Installs and configures the full Disaster Recovery stack on the Hubs (Active and Passive):
#   - Stage 00: Preflight & Safety Validation
#   - Stage 01: Azure Blob Storage Provisioning (Backups & Observability)
#   - Stage 02: Red Hat Advanced Cluster Management (MultiClusterHub)
#   - Stage 03: MultiClusterObservability (Thanos Store/Querier)
#   - Stage 04: Red Hat OpenShift GitOps (Multi-Instance ArgoCD)
#   - Stage 05: OADP, DPA & BackupSchedule (ACM Disaster Recovery)
#   - Stage 06: Hub Health & Compliance Audit
#
# Example 1 (Provision Primary / Active Hub):
#   ansible-playbook playbooks/setup-acm-dr-hub.yml \
#     -e k8s_target_context="acm-primary-hub" \
#     -e is_primary_hub=true
#
# Example 2 (Provision Secondary / Passive DR Hub with Storage Reuse):
#   ansible-playbook playbooks/setup-acm-dr-hub.yml \
#     -e k8s_target_context="acm-dr-hub" \
#     -e is_primary_hub=false \
#     -e acm_dr_hub_setup_azure_storage_allow_reuse=true
#
# Example 3 (Partial Execution via Tags - Compliance Audit Only):
#   ansible-playbook playbooks/setup-acm-dr-hub.yml \
#     -e k8s_target_context="acm-primary-hub" \
#     --tags "validate"
#
# Variables (required):
#   k8s_target_context              - kubeconfig context for the target Hub SA.
#                                     Injected via ACM DR Target Cluster AAP credential.
#   is_primary_hub                  - true: provision as active leader (BackupSchedule enabled).
#                                     false: provision as passive DR Hub (sync Restore enabled).
#   acm_dr_hub_setup_cloud_provider - 'azure' (ARO Hubs) or 'aws' (ROSA HCP Hubs).
#
# Variables (Azure - required when cloud_provider = azure):
#   acm_dr_hub_setup_azure_storage_account_name - globally unique Storage Account name (3-24 chars)
#   acm_dr_hub_setup_azure_resource_group       - Resource Group containing the Storage Account
#
# Variables (AWS - required when cloud_provider = aws):
#   acm_dr_hub_setup_aws_s3_bucket_backup        - S3 bucket name for OADP backups
#   acm_dr_hub_setup_aws_s3_bucket_observability - S3 bucket name for Thanos observability
#
# Dependencies:
#   collections: kubernetes.core, azure.azcollection (Azure path), amazon.aws (AWS path)
#   roles:       acm_dr_kubeconfig_resolver (pre_tasks)
#                acm_dr_hub_setup (Stages 00-06)
#
# Expected outcome:
#   Exit 0 - Hub fully provisioned: RHACM Running, OADP DPA Available, BackupSchedule active
#             (primary) or passive Restore syncing (DR Hub). Final audit report clean.
#   Exit 1 - Preflight gate fails (missing credentials, connectivity error) or an infrastructure
#             stage fails. Check the ❌ message and Stage identifier in the output.
# =============================================================================

- name: "[DR LAB PROVISIONING] | Install and Configure ACM, GitOps, OADP and Observability"
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      # Uses the runtime kubeconfig assembled by acm_dr_kubeconfig_resolver (per-cluster
      # credentials from AAP or scripts/lib/load_cluster_env.sh), falling back to the legacy
      # monolithic K8S_AUTH_KUBECONFIG / KUBECONFIG env var when no per-cluster vars exist.
      kubeconfig: >-
        {{ acm_dr_kubeconfig_path
           | default(lookup('ansible.builtin.env', 'K8S_AUTH_KUBECONFIG')
                     | default(lookup('ansible.builtin.env', 'KUBECONFIG'), true)) }}

  pre_tasks:
    - name: "[PRE-FLIGHT] | Resolve kubeconfig from per-cluster credentials"
      ansible.builtin.include_role:
        name: acm_dr_kubeconfig_resolver
        apply:
          tags: [always]  # propagate to tasks inside the role so they also run
      tags: [always]  # ensures the include itself runs regardless of --tags filtering

    # Derive k8s_target_context from per-cluster credentials when not passed
    # as extra var. ACM_DR_TARGET_CONTEXT is injected by the "ACM DR Target
    # Cluster" credential type or exported via load_cluster_env.sh.
    - name: "[PRE-FLIGHT] | Derive target context from per-cluster credentials"
      ansible.builtin.set_fact:
        k8s_target_context: "{{ lookup('ansible.builtin.env', 'ACM_DR_TARGET_CONTEXT', default='') }}"  # noqa var-naming[no-role-prefix]
      when:
        - k8s_target_context is not defined
        - lookup('ansible.builtin.env', 'ACM_DR_TARGET_CONTEXT', default='') | length > 0

    - name: "[PRE-FLIGHT] | Validate required input variables"
      ansible.builtin.assert:
        that:
          - k8s_target_context is defined
          - k8s_target_context | length > 0
        fail_msg: "❌ FAILED! Oh. No! => Required variable 'k8s_target_context' is not defined. Use: -e k8s_target_context=<context>"
        success_msg: "✅ PASSED! Oh. Yes! => Required variable 'k8s_target_context' is defined and valid."

  roles:
    - role: "{{ playbook_dir }}/../roles/acm_dr_hub_setup"
...
