---
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: ansible-automation
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ansible-dr-orchestrator
      namespace: ansible-automation
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: ansible-dr-orchestrator-admin
    subjects:
      - kind: ServiceAccount
        name: ansible-dr-orchestrator
        namespace: ansible-automation
    roleRef:
      kind: ClusterRole
      name: cluster-admin
      apiGroup: rbac.authorization.k8s.io
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ansible-dr-orchestrator-token
      namespace: ansible-automation
      annotations:
        kubernetes.io/service-account.name: ansible-dr-orchestrator
    type: kubernetes.io/service-account-token
...
