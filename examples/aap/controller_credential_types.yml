---
# aap/controller_credential_types.yml
#
# Custom Credential Type definitions for Red Hat Ansible Automation Platform.
# Compatible with the infra.controller_configuration collection and the AAP Controller API.
#
# These credential types complement AAP's built-in types to support the multi-context
# kubeconfig pattern and GitHub PAT injection required by this automation suite.
#
# Usage:
#   ansible-playbook -e @aap/controller_credential_types.yml \
#     -e "controller_hostname=https://aap.example.com" \
#     -e "controller_username=admin" \
#     -e "controller_password=changeme" \
#     infra.controller_configuration.credential_types

controller_credential_types:

  # ---------------------------------------------------------------------------
  # 1. ACM DR - Source Hub (per-cluster - failover origin)
  # ---------------------------------------------------------------------------
  # Injects credentials for the currently ACTIVE Hub in a failover scenario.
  # Used exclusively by the Failover Orchestrator (orchestrate-dr-failover.yml).
  # The acm_dr_kubeconfig_resolver role reads these env vars and builds a runtime
  # kubeconfig context for the source Hub.
  # ---------------------------------------------------------------------------
  - name: ACM DR - Source Hub
    description: >-
      Per-cluster credentials for the failover origin Hub (currently ACTIVE).
      Injects ACM_DR_SOURCE_HOST, ACM_DR_SOURCE_TOKEN, ACM_DR_SOURCE_CA_DATA,
      and ACM_DR_SOURCE_CONTEXT. Used by the Failover Orchestrator playbook.
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: "OpenShift/K8s API Host (Required)"
          help_text: >-
            API endpoint URL of the source Hub cluster
            (e.g., https://api.your-hub-01.example.com:6443).
        - id: api_key
          type: string
          label: "API Bearer Token (Required)"
          secret: true
          help_text: >-
            ServiceAccount Bearer Token (from provision_automation_sa.sh).
        - id: ca_data
          type: string
          label: "CA Certificate Data (base64) (Optional)"
          secret: true
          multiline: true
          help_text: >-
            Base64-encoded CA certificate bundle. Leave empty for clusters
            with publicly trusted certificates (e.g., ARO).
        - id: context_name
          type: string
          label: "Kubeconfig Context Name (Required)"
          help_text: >-
            Name tasks use to select this cluster (e.g., your-hub-01-sa).
            Must match the -sa context convention from provision_automation_sa.sh.
      required:
        - host
        - api_key
        - context_name
    injectors:
      env:
        ACM_DR_SOURCE_HOST: !unsafe "{{ host }}"
        ACM_DR_SOURCE_TOKEN: !unsafe "{{ api_key }}"
        ACM_DR_SOURCE_CA_DATA: !unsafe "{{ ca_data | default('') }}"
        ACM_DR_SOURCE_CONTEXT: !unsafe "{{ context_name }}"

  # ---------------------------------------------------------------------------
  # 3. ACM DR - Destination Hub (per-cluster - failover target)
  # ---------------------------------------------------------------------------
  # Injects credentials for the currently PASSIVE Hub in a failover scenario.
  # Used exclusively by the Failover Orchestrator (orchestrate-dr-failover.yml).
  # ---------------------------------------------------------------------------
  - name: ACM DR - Destination Hub
    description: >-
      Per-cluster credentials for the failover destination Hub (currently PASSIVE).
      Injects ACM_DR_DEST_HOST, ACM_DR_DEST_TOKEN, ACM_DR_DEST_CA_DATA,
      and ACM_DR_DEST_CONTEXT. Used by the Failover Orchestrator playbook.
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: "OpenShift/K8s API Host (Required)"
          help_text: >-
            API endpoint URL of the destination Hub cluster
            (e.g., https://api.your-hub-02.example.com:6443).
        - id: api_key
          type: string
          label: "API Bearer Token (Required)"
          secret: true
          help_text: >-
            ServiceAccount Bearer Token (from provision_automation_sa.sh).
        - id: ca_data
          type: string
          label: "CA Certificate Data (base64) (Optional)"
          secret: true
          multiline: true
          help_text: >-
            Base64-encoded CA certificate bundle. Leave empty for clusters
            with publicly trusted certificates (e.g., ARO).
        - id: context_name
          type: string
          label: "Kubeconfig Context Name (Required)"
          help_text: >-
            Name tasks use to select this cluster (e.g., acm-dr-hub-sa).
      required:
        - host
        - api_key
        - context_name
    injectors:
      env:
        ACM_DR_DEST_HOST: !unsafe "{{ host }}"
        ACM_DR_DEST_TOKEN: !unsafe "{{ api_key }}"
        ACM_DR_DEST_CA_DATA: !unsafe "{{ ca_data | default('') }}"
        ACM_DR_DEST_CONTEXT: !unsafe "{{ context_name }}"

  # ---------------------------------------------------------------------------
  # 4. ACM DR - Target Cluster (per-cluster - single-target operations)
  # ---------------------------------------------------------------------------
  # Injects credentials for the single target cluster in operations that only
  # need one cluster: Lab Setup, Lab Cleanup, ArgoCD Instance Setup/Cleanup,
  # and Spoke Manager (Hub-side).
  # ---------------------------------------------------------------------------
  - name: ACM DR - Target Cluster
    description: >-
      Per-cluster credentials for single-target operations (Hub Setup, Cleanup,
      ArgoCD, Spoke Manager Hub-side). Injects ACM_DR_TARGET_HOST,
      ACM_DR_TARGET_TOKEN, ACM_DR_TARGET_CA_DATA, and ACM_DR_TARGET_CONTEXT.
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: "OpenShift/K8s API Host (Required)"
          help_text: >-
            API endpoint URL of the target cluster
            (e.g., https://api.your-hub-01.example.com:6443).
        - id: api_key
          type: string
          label: "API Bearer Token (Required)"
          secret: true
          help_text: >-
            ServiceAccount Bearer Token (from provision_automation_sa.sh).
        - id: ca_data
          type: string
          label: "CA Certificate Data (base64) (Optional)"
          secret: true
          multiline: true
          help_text: >-
            Base64-encoded CA certificate bundle. Leave empty for clusters
            with publicly trusted certificates.
        - id: context_name
          type: string
          label: "Kubeconfig Context Name (Required)"
          help_text: >-
            Name tasks use to select this cluster (e.g., your-hub-01-sa).
      required:
        - host
        - api_key
        - context_name
    injectors:
      env:
        ACM_DR_TARGET_HOST: !unsafe "{{ host }}"
        ACM_DR_TARGET_TOKEN: !unsafe "{{ api_key }}"
        ACM_DR_TARGET_CA_DATA: !unsafe "{{ ca_data | default('') }}"
        ACM_DR_TARGET_CONTEXT: !unsafe "{{ context_name }}"

  # ---------------------------------------------------------------------------
  # 5. ACM DR - Spoke Cluster (per-cluster - individual Spoke)
  # ---------------------------------------------------------------------------
  # Injects credentials for a single Spoke cluster. Used by Spoke Manager
  # (manage-spoke.yml) for direct connectivity to the Spoke during onboarding
  # (bootstrap SA creation, token extraction) and detach operations.
  # ---------------------------------------------------------------------------
  - name: ACM DR - Spoke Cluster
    description: >-
      Per-cluster credentials for an individual Spoke cluster. Injects
      ACM_DR_SPOKE_HOST, ACM_DR_SPOKE_TOKEN, ACM_DR_SPOKE_CA_DATA, and
      ACM_DR_SPOKE_CONTEXT. Used by Spoke Manager and Spoke Onboarding for
      direct Spoke connectivity.
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: "OpenShift/K8s API Host (Required)"
          help_text: >-
            API endpoint URL of the Spoke cluster
            (e.g., https://api.your-spoke-01.example.com:6443).
        - id: api_key
          type: string
          label: "API Bearer Token (Required)"
          secret: true
          help_text: >-
            ServiceAccount Bearer Token (from provision_automation_sa.sh).
        - id: ca_data
          type: string
          label: "CA Certificate Data (base64) (Optional)"
          secret: true
          multiline: true
          help_text: >-
            Base64-encoded CA certificate bundle.
        - id: context_name
          type: string
          label: "Kubeconfig Context Name (Required)"
          help_text: >-
            Name tasks use to select this cluster (e.g., aro-spoke-01-sa).
      required:
        - host
        - api_key
        - context_name
    injectors:
      env:
        ACM_DR_SPOKE_HOST: !unsafe "{{ host }}"
        ACM_DR_SPOKE_TOKEN: !unsafe "{{ api_key }}"
        ACM_DR_SPOKE_CA_DATA: !unsafe "{{ ca_data | default('') }}"
        ACM_DR_SPOKE_CONTEXT: !unsafe "{{ context_name }}"

  # ---------------------------------------------------------------------------
  # 6. GitHub Personal Access Token (PAT)
  # ---------------------------------------------------------------------------
  # Used by acm_dr_hub_setup (Stage 04 - GitOps/ArgoCD) to authenticate against
  # private Git repositories when creating ArgoCD repo-secret credentials.
  # ---------------------------------------------------------------------------
  - name: ACM DR - GitHub PAT
    description: >-
      GitHub Personal Access Token and GitOps repository URL for Hub Setup Stage 04.
      Injects GITHUB_USER, GITHUB_PAT, and GITHUB_REPO into the EE environment.
      GITHUB_REPO is read by acm_dr_hub_setup as acm_dr_hub_setup_github_repo_url
      for ArgoCD repository Secret creation.
    kind: cloud
    inputs:
      fields:
        - id: github_username
          type: string
          label: "GitHub Username (Required)"
          help_text: >-
            GitHub username for repository authentication (e.g., your-github-username).
        - id: github_pat
          type: string
          label: "GitHub Personal Access Token (Required)"
          secret: true
          help_text: >-
            GitHub PAT with at least repo scope for private repository access.
        - id: github_repo_url
          type: string
          label: "GitOps Repository URL (Required)"
          help_text: >-
            Full HTTPS URL of the GitOps repository used by ArgoCD in Hub Setup
            Stage 04 (e.g., https://github.com/your-org/your-gitops-repo.git).
      required:
        - github_username
        - github_pat
        - github_repo_url
    injectors:
      env:
        GITHUB_USER: !unsafe "{{ github_username }}"
        GITHUB_PAT: !unsafe "{{ github_pat }}"
        GITHUB_REPO: !unsafe "{{ github_repo_url }}"

  # ---------------------------------------------------------------------------
  # 9. ACM DR - Notification Webhook
  # ---------------------------------------------------------------------------
  # Used by the JTs that send context-rich notifications from WJT failure paths:
  # Check Approval Outcome (JT-10), Switchover State Diagnostics (JT-11), and
  # Notify Workflow Event (JT-12). Works with any system that accepts an HTTP POST
  # webhook: Slack incoming webhooks, MS Teams incoming webhooks, PagerDuty Events
  # API, Opsgenie, generic ITSM middleware, etc.
  #
  # Create one instance of this credential per notification target. Attach it to
  # JT-10, JT-11, and JT-12 permanently, or to individual WJT nodes at launch time.
  - name: "ACM DR - Notification Webhook"
    description: >-
      Webhook endpoint for context-rich WJT failure notifications. Injects
      NOTIF_WEBHOOK_URL and NOTIF_WEBHOOK_FORMAT into the EE environment. Used by
      Check Approval Outcome, Switchover State Diagnostics, and Notify Workflow Event
      Job Templates. Accepts any HTTP POST endpoint: Slack incoming webhooks, MS Teams
      incoming webhooks, PagerDuty Events API, or custom ITSM middleware. Create one
      instance per notification target and attach it to the relevant Job Templates.
    kind: cloud
    inputs:
      fields:
        - id: webhook_url
          type: string
          label: "Webhook URL (Required)"
          secret: true
          help_text: >-
            The full HTTPS URL of the incoming webhook endpoint. For Slack: the App
            Incoming Webhook URL (https://hooks.slack.com/services/...). For Teams:
            the channel Incoming Webhook connector URL. For PagerDuty: use
            https://events.pagerduty.com/v2/enqueue with your integration key. For
            generic systems: any URL that accepts HTTP POST with a JSON body.
        - id: webhook_format
          type: string
          label: "Payload Format (Required)"
          help_text: >-
            Controls how the JSON body is structured. Accepted values: 'slack'
            (text field with Markdown), 'teams' (Adaptive Card for MS Teams incoming
            webhooks), 'generic-json' (flat JSON with title/body/severity fields for
            custom integrations). Any value other than 'slack' or 'teams' falls back
            to generic-json.
      required:
        - webhook_url
        - webhook_format
    injectors:
      env:
        NOTIF_WEBHOOK_URL: !unsafe "{{ webhook_url }}"
        NOTIF_WEBHOOK_FORMAT: !unsafe "{{ webhook_format }}"

  # ---------------------------------------------------------------------------
  # 8. ACM DR - AAP Automation Token
  # ---------------------------------------------------------------------------
  # Stores the API token of a user with org-admin on the ACM DR org. The
  # Bootstrap JT uses it to self-register the permanent SA credential at the
  # end of each run. One instance per AAP installation; attach it permanently
  # to the Bootstrap JT. Do not create one per cluster.
  - name: "ACM DR - AAP Automation Token"
    description: >-
      API token of a user with org-admin on the ACM DR organization. The Bootstrap JT
      uses CONTROLLER_OAUTH_TOKEN to call the AAP REST API and create or update the
      permanent SA credential after each cluster bootstrap run. One instance per AAP
      installation; attach permanently to the Bootstrap JT.
    kind: cloud
    inputs:
      fields:
        - id: controller_host
          type: string
          label: "AAP Gateway URL (Required)"
          help_text: >-
            The full URL of the AAP Gateway (e.g., https://aap.example.com). The Bootstrap
            JT uses this to reach the AAP REST API for SA credential registration.
        - id: controller_oauth_token
          type: string
          secret: true
          label: "AAP API Token (Required)"
          help_text: >-
            Personal API token of a user with org-admin on the ACM DR organization.
            Generate it in AAP UI at Access Management > Users > <user> > Tokens > Create
            (scope: write). The token is shown only once at creation time.
        - id: validate_certs
          type: boolean
          label: "Validate TLS Certificate (Optional)"
          help_text: >-
            Set true to verify the AAP Gateway TLS certificate chain. Set false only for
            lab environments with self-signed certificates.
      required:
        - controller_host
        - controller_oauth_token
    injectors:
      env:
        CONTROLLER_HOST: !unsafe "{{ controller_host }}"
        CONTROLLER_OAUTH_TOKEN: !unsafe "{{ controller_oauth_token }}"
        CONTROLLER_VERIFY_SSL: !unsafe "{{ validate_certs | default(False) | string | lower }}"

  # ---------------------------------------------------------------------------
  # 10. ACM DR - Passive Hub Fleet (N+ hub topology)
  # ---------------------------------------------------------------------------
  # Stores a multi-context kubeconfig containing one context per additional
  # passive hub beyond the primary DR pair. Supports any number of additional
  # passive hubs in a single credential instance: build the kubeconfig with
  # provision_automation_sa.sh for each hub, then merge contexts:
  #   KUBECONFIG=hub3.kubeconfig:hub4.kubeconfig kubectl config view --flatten
  #
  # AAP writes the kubeconfig content to a temp file and injects
  # ACM_DR_PASSIVE_HUB_FLEET_KUBECONFIG with the file path. The
  # acm_dr_kubeconfig_resolver role reads this file and merges all passive hub
  # contexts into the runtime kubeconfig before the Failover Orchestrator runs.
  #
  # Context names in this kubeconfig must match the values passed in the
  # additional_passive_hubs survey field. Update the credential whenever a
  # passive hub is added or removed. Attach permanently to the Hub Switchover JT.
  - name: "ACM DR - Passive Hub Fleet"
    description: >-
      Multi-context kubeconfig for all additional passive hubs beyond the primary DR pair.
      Supports N+ hub topology by packing all additional hub contexts into a single credential
      instance. AAP injects the kubeconfig as a temp file; acm_dr_kubeconfig_resolver merges
      its contexts at runtime. Context names must match the values in the additional_passive_hubs
      survey field. Update when passive hubs are added or removed. Attach permanently to the
      Hub Switchover Job Template.
    kind: cloud
    inputs:
      fields:
        - id: passive_hub_fleet_kubeconfig
          type: string
          label: "Passive Hub Fleet Kubeconfig (Required)"
          secret: true
          multiline: true
          help_text: >-
            Full kubeconfig YAML with one context per additional passive hub. Build it with
            provision_automation_sa.sh for each hub and merge with:
            KUBECONFIG=hub3.kubeconfig:hub4.kubeconfig kubectl config view --flatten
            Context names must match the values in the additional_passive_hubs survey field
            (e.g., hub-tertiary-01, hub-quaternary-01).
      required:
        - passive_hub_fleet_kubeconfig
    injectors:
      file:
        template: !unsafe "{{ passive_hub_fleet_kubeconfig }}"
      env:
        ACM_DR_PASSIVE_HUB_FLEET_KUBECONFIG: !unsafe "{{ tower.filename }}"
...
