---
# examples/aap/controller_credentials.yml
#
# Credential instance templates for Red Hat Ansible Automation Platform.
# Compatible with the infra.controller_configuration collection and the AAP Controller API.
#
# ⚠️ SENSITIVE FILE: READ BEFORE USING:
#   This file contains PLACEHOLDER values only. Never commit real tokens, passwords,
#   or kubeconfig content to version control. Fill in the actual values either:
#     a) Via extra-vars at import time (safest): pass each REPLACE_WITH_* value as -e vars
#     b) Via a vault-encrypted override file: ansible-playbook ... -e @vault.yml
#     c) Manually in the AAP UI after importing the credential types
#
# CREDENTIAL TYPE NAMES (custom types defined in controller_credential_types.yml):
#   1. ACM DR - Source Hub               → per-cluster credentials for the active Hub
#   2. ACM DR - Destination Hub          → per-cluster credentials for the passive Hub
#   3. ACM DR - Target Cluster           → single-cluster operations (setup/cleanup/spoke)
#   4. ACM DR - Spoke Cluster            → per-Spoke credentials for Spoke-side tasks
#   5. ACM DR - GitHub PAT               → GitHub PAT for ArgoCD GitOps repo
#   6. ACM DR - AAP Automation Token     → API token for Bootstrap JT self-registration (org-admin user)
#   7. ACM DR - Notification Webhook     → webhook endpoint for JT-10 and JT-12 event notifications
#   8. ACM DR - Passive Hub Fleet        → multi-hub kubeconfig for additional passive hub management
#
# HOW TO GENERATE THE BEARER TOKEN FOR TYPES 2-5:
#   Run examples/scripts/cluster-onboarding/02_provision_automation_sa.sh on each cluster.
#   The script creates the ansible-dr-orchestrator ServiceAccount and writes the token
#   to ~/.kube/clusters/<context-name>.env. Copy the CLUSTER_TOKEN value from that file.
#
# Usage:
#   ansible-playbook -e @examples/aap/controller_credentials.yml \
#     -e "controller_hostname=https://aap.example.com" \
#     -e "controller_username=admin" \
#     -e "controller_password=changeme" \
#     -e "aap_organization=ACM DR Operations" \
#     -e "cred_primary_hub_host=https://api.your-hub-01.example.com:6443" \
#     -e "cred_primary_hub_token=eyJhbGciOi..." \
#     -e "cred_primary_hub_context=acmdr-lab-hub-01-sa" \
#     ... (repeat for each cluster) \
#     infra.controller_configuration.credentials
#
# IMPORT ORDER: credential types must exist first (controller_credential_types.yml).

controller_credentials:

  # ---------------------------------------------------------------------------
  # 1. Primary Hub - ACM DR Source Hub
  # ---------------------------------------------------------------------------
  # The currently ACTIVE Hub. Used as the "Source" in failover operations.
  # Attach to the "Hub Switchover" Job Template (or its Workflow) at launch time.
  - name: "ARO Hub 01 (Source)"
    description: >-
      Per-cluster credentials for the PRIMARY (active) RHACM Hub. Attach as the
      Source Hub credential on the Hub Switchover Job Template or Workflow.
      Generated by examples/scripts/cluster-onboarding/02_provision_automation_sa.sh.
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - Source Hub"
    inputs:
      # API URL - from oc get infrastructure cluster -o jsonpath='{.status.apiServerURL}'
      host: "{{ cred_primary_hub_host | default('REPLACE_WITH_PRIMARY_HUB_API_URL') }}"
      # Long-lived SA token - from ~/.kube/clusters/<context>.env (CLUSTER_TOKEN field)
      # Never print this value; no_log: true applies in the resolver role.
      api_key: "{{ cred_primary_hub_token | default('REPLACE_WITH_PRIMARY_HUB_SA_TOKEN') }}"
      # Base64-encoded CA certificate bundle. Leave empty for clusters with public CAs (e.g., ARO).
      ca_data: "{{ cred_primary_hub_ca_data | default('') }}"
      # Kubeconfig context name matching the -sa convention: e.g., acmdr-lab-hub-01-sa
      context_name: "{{ cred_primary_hub_context | default('REPLACE_WITH_PRIMARY_HUB_CONTEXT') }}"

  # ---------------------------------------------------------------------------
  # 2. DR Hub - ACM DR Destination Hub
  # ---------------------------------------------------------------------------
  # The currently PASSIVE Hub. Used as the "Destination" in failover operations.
  # Attach to the "Hub Switchover" Job Template (or its Workflow) at launch time.
  - name: "ARO Hub 02 (Dest)"
    description: >-
      Per-cluster credentials for the DR (passive) RHACM Hub. Attach as the
      Destination Hub credential on the Hub Switchover Job Template or Workflow.
      Generated by examples/scripts/cluster-onboarding/02_provision_automation_sa.sh.
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - Destination Hub"
    inputs:
      host: "{{ cred_dr_hub_host | default('REPLACE_WITH_DR_HUB_API_URL') }}"
      api_key: "{{ cred_dr_hub_token | default('REPLACE_WITH_DR_HUB_SA_TOKEN') }}"
      ca_data: "{{ cred_dr_hub_ca_data | default('') }}"
      context_name: "{{ cred_dr_hub_context | default('REPLACE_WITH_DR_HUB_CONTEXT') }}"

  # ---------------------------------------------------------------------------
  # 3. Primary Hub - ACM DR Target Cluster (for Setup/Cleanup/Spoke operations)
  # ---------------------------------------------------------------------------
  # Single-cluster credential for operations that target ONE Hub at a time:
  # Hub Setup, Hub Cleanup, Spoke Onboarding (Hub side).
  # Uses the "Target Cluster" type (not Source/Dest, which are failover-specific).
  - name: "ARO Hub 01 (SA)"
    description: >-
      Single-target credentials for the PRIMARY Hub. Used for Hub Setup, Hub Cleanup,
      and Spoke Manager operations (Hub side). Not used for failover. Use
      "ARO Hub 01 (Source)" and "ARO Hub 02 (Dest)" for failover.
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - Target Cluster"
    inputs:
      host: "{{ cred_primary_hub_host | default('REPLACE_WITH_PRIMARY_HUB_API_URL') }}"
      api_key: "{{ cred_primary_hub_token | default('REPLACE_WITH_PRIMARY_HUB_SA_TOKEN') }}"
      ca_data: "{{ cred_primary_hub_ca_data | default('') }}"
      context_name: "{{ cred_primary_hub_context | default('REPLACE_WITH_PRIMARY_HUB_CONTEXT') }}"

  # ---------------------------------------------------------------------------
  # 4. DR Hub - ACM DR Target Cluster (for Setup/Cleanup operations)
  # ---------------------------------------------------------------------------
  - name: "ARO Hub 02 (SA)"
    description: >-
      Single-target credentials for the DR Hub. Used for Hub Setup and Hub Cleanup.
      Not used for failover.
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - Target Cluster"
    inputs:
      host: "{{ cred_dr_hub_host | default('REPLACE_WITH_DR_HUB_API_URL') }}"
      api_key: "{{ cred_dr_hub_token | default('REPLACE_WITH_DR_HUB_SA_TOKEN') }}"
      ca_data: "{{ cred_dr_hub_ca_data | default('') }}"
      context_name: "{{ cred_dr_hub_context | default('REPLACE_WITH_DR_HUB_CONTEXT') }}"

  # ---------------------------------------------------------------------------
  # 5. GitHub PAT
  # ---------------------------------------------------------------------------
  # GitHub Personal Access Token for Stage 04 of Hub Setup. Creates an ArgoCD
  # repository Secret using GITHUB_USER, GITHUB_PAT, and GITHUB_REPO. This is
  # the only credential permanently attached to the Hub Setup Job Template.
  # The credential type injects GITHUB_REPO so the role's
  # acm_dr_hub_setup_github_repo_url default resolves without extra-vars.
  - name: "ACM DR - GitHub PAT"
    description: >-
      GitHub credentials and GitOps repository URL for Hub Setup Stage 04
      (ArgoCD repository Secret creation). Permanently attached to the Hub Setup
      Job Template. Injects GITHUB_USER, GITHUB_PAT, and GITHUB_REPO.
      Scope needed: repo (read access to the GitOps repository).
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - GitHub PAT"
    inputs:
      github_username: "{{ cred_github_user | default('REPLACE_WITH_GITHUB_USERNAME') }}"
      # Personal Access Token - classic or fine-grained with repo:read scope.
      github_pat: "{{ cred_github_pat | default('REPLACE_WITH_GITHUB_PAT') }}"
      github_repo_url: "{{ cred_github_repo_url | default('REPLACE_WITH_GITOPS_REPO_URL') }}"

  # ---------------------------------------------------------------------------
  # 7. AAP Bootstrap Automation (API Token) - used by Bootstrap JT for self-registration
  # ---------------------------------------------------------------------------
  # One instance per AAP installation. The Bootstrap JT reads CONTROLLER_HOST and
  # CONTROLLER_OAUTH_TOKEN from this credential to call back into AAP and create
  # the permanent SA credential automatically. Generate the token in AAP UI at
  # Access Management > Users > <user> > Tokens > Create (scope: write).
  - name: "AAP Bootstrap Automation (API Token)"
    description: >-
      API token of a user with org-admin on the ACM DR organization. Attached permanently
      to the 'JT - ACM DR - LAB - Cluster Bootstrap' JT. The Bootstrap JT uses CONTROLLER_OAUTH_TOKEN
      to call the AAP REST API and create or update permanent SA credentials after each
      cluster bootstrap run. One instance per AAP installation. Generate the token at
      Access Management > Users > <user> > Tokens > Create (scope: write).
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - AAP Automation Token"
    inputs:
      controller_host: "{{ cred_aap_host | default('REPLACE_WITH_AAP_GATEWAY_URL') }}"
      controller_oauth_token: "{{ cred_aap_oauth_token | default('REPLACE_WITH_AAP_API_TOKEN') }}"
      validate_certs: "{{ cred_aap_validate_certs | default(false) }}"

  # ---------------------------------------------------------------------------
  # 8. ACM DR Notifications (Webhook) - attached permanently to JT-10 and JT-12
  # ---------------------------------------------------------------------------
  # One instance per notification target. JT-10 (Check Approval Outcome) and JT-12
  # (Notify Workflow Event) read NOTIF_WEBHOOK_URL and NOTIF_WEBHOOK_FORMAT from this
  # credential to send context-rich notifications on WJT events. Fill in the actual
  # webhook URL before importing (or pass cred_notif_webhook_url via -e / @vault.yml).
  - name: "ACM DR Notifications (Webhook)"
    description: >-
      Webhook endpoint for context-rich WJT event notifications. Injects NOTIF_WEBHOOK_URL
      and NOTIF_WEBHOOK_FORMAT into the EE environment. Permanently attached to
      'JT - ACM DR - LAB - Check Approval Outcome' and 'JT - ACM DR - LAB - Notify Workflow Event'.
      Accepts Slack incoming webhooks (format: slack), MS Teams incoming webhooks
      (format: teams), or any HTTP POST endpoint (format: generic-json).
    organization: "{{ aap_organization }}"
    credential_type: "ACM DR - Notification Webhook"
    inputs:
      # Full HTTPS URL of the webhook endpoint. For Slack: https://hooks.slack.com/services/...
      webhook_url: "{{ cred_notif_webhook_url | default('REPLACE_WITH_WEBHOOK_URL') }}"
      # Payload format: 'slack', 'teams', or 'generic-json'
      webhook_format: "{{ cred_notif_webhook_format | default('slack') }}"

  # ---------------------------------------------------------------------------
  # 9. Azure Service Principal - shared credential for Hub Setup (all hubs)
  # ---------------------------------------------------------------------------
  # One instance covers both Hub 01 and Hub 02. Both hubs share the same OADP
  # storage account, so they do not need separate Azure credentials.
  # The SP must have Owner or User Access Administrator on the resource group
  # where the storage account lives (or will be created). Contributor is not
  # enough: Stage 01 of Hub Setup calls Microsoft.Authorization/roleAssignments/write
  # to assign Storage Blob Data Contributor to the Velero workload identity.
  # Name follows the convention: <System> <id> (<auth type>), e.g., Azure acmdr-lab (SP)
  - name: "Azure acmdr-lab (SP)"
    description: >-
      Shared Microsoft Azure Resource Manager credential for Hub Setup on all hubs.
      The service principal must have Owner or User Access Administrator on the
      resource group that contains (or will contain) the OADP storage account.
      Contributor alone is not sufficient: Hub Setup Stage 01 assigns
      Storage Blob Data Contributor to the Velero identity, which requires
      Microsoft.Authorization/roleAssignments/write. Fill in the SP details from
      your Azure app registration; never commit the client secret to version control.
    organization: "{{ aap_organization }}"
    credential_type: "Microsoft Azure Resource Manager"
    inputs:
      # Azure subscription containing the OADP storage resource group
      subscription: "{{ cred_azure_subscription_id | default('REPLACE_WITH_SUBSCRIPTION_ID') }}"
      # Service principal application (client) ID
      client: "{{ cred_azure_client_id | default('REPLACE_WITH_CLIENT_ID') }}"
      # Service principal client secret - never commit this value
      secret: "{{ cred_azure_client_secret | default('REPLACE_WITH_CLIENT_SECRET') }}"
      # Azure Active Directory tenant ID
      tenant: "{{ cred_azure_tenant_id | default('REPLACE_WITH_TENANT_ID') }}"

  # ---------------------------------------------------------------------------
  # Additional Spoke credentials (repeat pattern for each Spoke cluster)
  # ---------------------------------------------------------------------------
  # Create one "ACM DR - Spoke Cluster" credential per Spoke in your fleet.
  # The credential name follows the pattern: <Distro> Spoke <NN> (Spoke Cluster)
  # Copy and fill in values for each Spoke; attach to the Spoke Onboarding JT
  # or a WF-04 node when running onboarding.
  #
  # ARO Classic Spoke example:
  # - name: "ARO Classic Spoke 01 (Spoke Cluster)"
  #   description: >-
  #     Per-cluster credentials for ARO Classic Spoke 01. Authenticates as the
  #     ansible-dr-orchestrator ServiceAccount in the ansible-automation namespace.
  #     Used by Spoke Onboarding and Spoke lifecycle (detach) operations.
  #     Token generated by examples/scripts/cluster-onboarding/02_provision_automation_sa.sh.
  #   organization: "{{ aap_organization }}"
  #   credential_type: "ACM DR - Spoke Cluster"
  #   inputs:
  #     host: "{{ cred_spoke01_aro_host | default('REPLACE_WITH_SPOKE_API_URL') }}"
  #     api_key: "{{ cred_spoke01_aro_token | default('REPLACE_WITH_SPOKE_SA_TOKEN') }}"
  #     ca_data: ""   # ARO uses publicly trusted certificates
  #     context_name: "aro-spoke-01-sa"
  #
  # AKS Spoke example (local accounts disabled - SA token from provisioned SA):
  # - name: "AKS Spoke 01 (Spoke Cluster)"
  #   description: >-
  #     Per-cluster credentials for AKS Spoke 01. Authenticates as the
  #     ansible-dr-orchestrator ServiceAccount in the ansible-automation namespace.
  #     AKS local accounts are disabled on this cluster; the token comes from the
  #     SA directly (not from az aks get-credentials --admin).
  #     Token generated by examples/scripts/cluster-onboarding/02_provision_automation_sa.sh
  #     or extracted from the existing SA secret.
  #   organization: "{{ aap_organization }}"
  #   credential_type: "ACM DR - Spoke Cluster"
  #   inputs:
  #     host: "{{ cred_spoke01_aks_host | default('REPLACE_WITH_AKS_API_URL') }}"
  #     api_key: "{{ cred_spoke01_aks_token | default('REPLACE_WITH_SA_TOKEN') }}"
  #     # AKS CA data is base64-encoded in the kubeconfig cluster entry.
  #     # Extract with: kubectl config view --raw --context <ctx> -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
  #     ca_data: "{{ cred_spoke01_aks_ca | default('REPLACE_WITH_BASE64_CA') }}"
  #     context_name: "aks-spoke-01-sa"
...
