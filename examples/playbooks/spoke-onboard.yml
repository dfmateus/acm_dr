---
# examples/playbooks/spoke-onboard.yml
# Onboard a new Spoke (managed cluster) to a Hub.
# Supports any Kubernetes distribution: ARO, AKS, EKS, GKE, IKS, vanilla K8s.
#
# Required extra vars:
#   k8s_target_context                      - kubeconfig context for the Hub
#   acm_dr_spoke_manager_cluster_name       - name for the ManagedCluster object
#   acm_dr_spoke_manager_spoke_k8s_context  - kubeconfig context for the Spoke
#
# Usage:
#   ansible-playbook examples/playbooks/spoke-onboard.yml \
#     -e k8s_target_context="acm-primary-hub-sa" \
#     -e acm_dr_spoke_manager_cluster_name="my-spoke-01" \
#     -e acm_dr_spoke_manager_spoke_k8s_context="my-spoke-01-sa" \
#     --tags "spoke_prep"

- name: Onboard a Spoke cluster
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    # Resolve kubeconfig from per-cluster credentials or fall back to KUBECONFIG env var
    - role: dfmateus.acm_dr.acm_dr_kubeconfig_resolver

    # Import the Spoke into RHACM on the target Hub
    - role: dfmateus.acm_dr.acm_dr_spoke_manager
      vars:
        k8s_target_context: "acm-primary-hub-sa"  # Hub where the Spoke will be managed
        acm_dr_spoke_manager_action: "prep"  # onboarding action
        acm_dr_spoke_manager_cluster_name: "my-spoke-01"  # ManagedCluster name on the Hub
        acm_dr_spoke_manager_spoke_k8s_context: "my-spoke-01-sa"  # kubeconfig context for the Spoke
...
