---
# examples/scripts/testing/render_compliance_reports.yml
# Renders the DR compliance report template with mock data to validate
# Jinja2 syntax, missing default() filters, and layout regressions.
# No cluster access needed. Run from the project root:
#
#   ansible-playbook examples/scripts/testing/render_compliance_reports.yml
#
# Rendered reports go to examples/scripts/testing/rendered_reports/<scenario>.txt.
# Validate with: bash examples/scripts/testing/validate_rendered_reports.sh

# --- Scenario 1: All Green ---
- name: "Render compliance report - all_green"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - mock_data/_base.yml
    - mock_data/all_green.yml
  tasks:
    - name: "Render all_green report"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/acm_dr_failover_manager/templates/reports/dr_compliance_report.j2"
        dest: "{{ playbook_dir }}/rendered_reports/all_green.txt"
        mode: "0644"

